name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes anything, and `pull_request` runs code from forks —
# so the token this workflow hands to npm postinstall scripts gets checkout
# rights and nothing else.
permissions:
  contents: read

jobs:
  # Every OS the app ships to, because this suite touches the parts of Node
  # that differ between them. v0.7.0 added an fs.watch, and its first Windows
  # run died on a libuv assert (fs-event.c — an 8.3 short path never matches
  # the long one the OS reports back): abort(), no exception, nothing
  # catchable. Ubuntu passed it happily, so the crash surfaced only once a tag
  # existed, twice over. Three runners a push is the cheaper half of that.
  test:
    strategy:
      # one platform failing must not hide what the other two would have said
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # pinned to SHAs for the reasons spelled out in release.yml; keep the
      # two workflows on the same versions so a bump is one decision
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
