appId: dev.cedricdessalles.uar-companion
productName: UAR Companion
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
npmRebuild: false
# metadata for electron-updater (latest*.yml); release.yml attaches it to
# the GitHub release, the app checks it at runtime
publish:
  provider: github
  owner: Geptyro
  repo: uar-companion
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: true
  runAfterFinish: true
  createDesktopShortcut: true
  artifactName: UAR-Companion-Setup-${version}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  category: Game
  synopsis: Undead Assault Reborn replay uploader
  # no version in the name: the desktop and autostart entries store this
  # path, and a manually downloaded new version must land on the same one
  # or those entries break (auto-updates replace the file in place anyway)
  artifactName: UAR-Companion.${ext}
  syncDesktopName: true
mac:
  target: zip
  artifactName: UAR-Companion-${version}-mac.${ext}
