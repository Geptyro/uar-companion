<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>UAR Companion notification</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: transparent;
				font: 13px/1.45 var(--font-sans);
				-webkit-user-select: none;
				user-select: none;
				overflow: hidden;
			}
			.toast {
				margin: 6px;
				background: var(--surface);
				border: 1px solid var(--border);
				border-left: 3px solid var(--accent);
				border-radius: var(--radius-3);
				padding: 12px 14px;
				color: var(--text);
				box-shadow: var(--shadow-2);
				cursor: pointer;
				animation: slide-in 0.22s ease-out;
			}
			.title {
				font-weight: 650;
				margin: 0 0 2px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.sub {
				margin: 0;
				color: var(--text-dim);
				font-size: 12px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			@keyframes slide-in {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
		</style>
	</head>
	<body>
		<div class="toast" id="toast">
			<p class="title" id="title"></p>
			<p class="sub" id="sub"></p>
		</div>
		<script type="module" src="/src/toast.ts"></script>
	</body>
</html>
